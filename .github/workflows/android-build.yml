name: Android Build

on:
  push:
    branches: [ main, stage-1-four-versions-only, stage-3-win98-daily-ui, stage-4-self-update ]
    paths-ignore:
      - "downloads/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test note persistence and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WIN26-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
  verify_notepad:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Check native layout, menus, storage and reminder notifications
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            notepad_test_result=0
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=rocks.gorjan.gokixp.NotepadRegressionTest || notepad_test_result=$?
            adb pull /sdcard/Android/data/com.win26.launcher/files/notepad-layout-checks app/build/notepad-layout-checks || true
            exit "$notepad_test_result"
      - name: Upload Notepad verification results and rendered layouts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WIN26-notepad-verification
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/notepad-layout-checks/

  publish_update:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/stage-3-win98-daily-ui'
    needs: [build, verify_notepad]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch stable public AOSP test signing key
        run: |
          mkdir -p "$RUNNER_TEMP/win26-signing"
          AOSP_BUILD_COMMIT="045a3d6a3e359633a14853a5a5e1e4f2a11cbdae"
          BASE="https://raw.githubusercontent.com/aosp-mirror/platform_build/$AOSP_BUILD_COMMIT/target/product/security"
          curl -fsSL "$BASE/testkey.pk8" -o "$RUNNER_TEMP/win26-signing/testkey.pk8"
          curl -fsSL "$BASE/testkey.x509.pem" -o "$RUNNER_TEMP/win26-signing/testkey.x509.pem"

      - name: Assign monotonic app version
        run: |
          echo "WIN26_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "WIN26_VERSION_NAME=0.4.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build release APK
        # Source already passed assembleDebug above. Skip release lint-vital here because
        # its tool-only dependencies can intermittently fail to resolve on GitHub runners.
        run: ./gradlew --no-daemon assembleRelease -x lintVitalAnalyzeRelease

      - name: Align and sign release APK with stable public test key
        run: |
          mkdir -p dist
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS/apksigner"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          if [ ! -x "$APKSIGNER" ] || [ ! -x "$ZIPALIGN" ]; then
            echo "Android signing tools not found"
            exit 1
          fi

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/WIN26-aligned.apk"

          "$ZIPALIGN" -P 16 -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$ZIPALIGN" -c -P 16 -v 4 "$ALIGNED"

          "$APKSIGNER" sign \
            --key "$RUNNER_TEMP/win26-signing/testkey.pk8" \
            --cert "$RUNNER_TEMP/win26-signing/testkey.x509.pem" \
            --out dist/WIN26.apk \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose --print-certs dist/WIN26.apk
          "$ZIPALIGN" -c -P 16 -v 4 dist/WIN26.apk

      - name: Upload signed WIN26 APK
        uses: actions/upload-artifact@v4
        with:
          name: WIN26-signed-apk
          path: dist/WIN26.apk
          compression-level: 0

      - name: Prepare update manifest
        run: |
          APK_SHA256=$(sha256sum dist/WIN26.apk | awk '{print $1}')
          cat > dist/update.json <<EOF
          {
            "versionCode": $WIN26_VERSION_CODE,
            "versionName": "$WIN26_VERSION_NAME",
            "apkUrl": "https://github.com/dugasmarcel-wq/WIN26/releases/latest/download/WIN26.apk",
            "sha256": "$APK_SHA256"
          }
          EOF
          cat dist/update.json

      - name: Publish latest self-update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="win26-update-$WIN26_VERSION_CODE"
          gh release create "$tag" dist/WIN26.apk dist/update.json \
            --target "$GITHUB_SHA" \
            --title "WIN26 $WIN26_VERSION_NAME" \
            --notes "Signed WIN26 self-update build." \
            --latest


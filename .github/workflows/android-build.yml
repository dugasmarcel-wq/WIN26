name: Android Build

on:
  push:
    branches: [ main, stage-1-four-versions-only, stage-3-win98-daily-ui ]
    paths-ignore:
      - "downloads/**"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WIN26-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish stable APK download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/stage-3-win98-daily-ui'
        run: |
          mkdir -p downloads
          zip -j -9 downloads/WIN26-stage-3-win98-daily-shell.zip app/build/outputs/apk/debug/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/WIN26-stage-3-win98-daily-shell.zip
          if git diff --cached --quiet; then
            echo "APK download is already current."
          else
            git commit -m "Publish Stage 3 debug APK zip"
            git push
          fi

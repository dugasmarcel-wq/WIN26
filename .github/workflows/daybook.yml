name: Daybook Android
on:
  push:
    branches: [daybook-journal]
    paths: ["daybook/**", ".github/workflows/daybook.yml"]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build standalone journal
        run: bash daybook/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: daybook-unsigned
          path: daybook/build/Daybook-unsigned.apk
      - name: Prepare SDK signing utility for offline signing
        run: |
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          cp "$bt/lib/apksigner.jar" "$RUNNER_TEMP/apksigner.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-apksigner
          path: ${{ runner.temp }}/apksigner.jar
          retention-days: 1

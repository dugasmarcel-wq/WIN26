name: Publish separate Daybook
on:
  push:
    branches: [daybook-separate-updates]
    paths: ["daybook/separate-release/**", ".github/workflows/daybook-separate-publish.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daybook-separate-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Obtain previous signed release
        if: ${{ hashFiles('daybook/separate-release/bootstrap.delta.b64') != '' }}
        run: curl -fsSL --retry 5 --retry-all-errors https://github.com/dugasmarcel-wq/WIN26/releases/download/win26-update-100141/Dayboox-13.apk -o "$RUNNER_TEMP/daybook-base.apk"
      - name: Reconstruct exact signed APK
        if: ${{ hashFiles('daybook/separate-release/bootstrap.delta.b64') != '' }}
        run: python3 daybook/separate-release/reconstruct.py "$RUNNER_TEMP/daybook-base.apk"
      - name: Validate and publish separate feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash daybook/separate-release/publish.sh

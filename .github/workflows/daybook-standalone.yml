name: Build standalone Daybook
on:
  push:
    branches: [daybook-standalone]
    paths: ['daybook/**','.github/workflows/daybook-standalone.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: standalone-daybook
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/daybook-standalone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify released baseline and source syntax
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 https://github.com/dugasmarcel-wq/WIN26/releases/download/win26-update-100141/Dayboox-14.apk -o "$RUNNER_TEMP/base.apk"
          echo 'd42f3f48800ac75edfdd433dce8f06b778cb971782cf564fe820b82b7cd9faf0  '"$RUNNER_TEMP/base.apk" | sha256sum -c
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$RUNNER_TEMP/base.apk" | grep -F '78f942aa7b29f5cc057401bfa61029b0e7affb5ac50c06136b2edd0ae09e0510'
          for f in daybook/assets/*.js; do node --check "$f"; done
      - name: Build and sign separate APK
        run: |
          set -euo pipefail
          bash daybook/build.sh
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          keytool -genkeypair -keystore "$RUNNER_TEMP/standalone.jks" -storepass standalone-build -keypass standalone-build -alias standalone -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Daybook Standalone"
          cd daybook/build
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/standalone.jks" --ks-pass pass:standalone-build --out Daybook-Standalone.apk Daybook-unsigned.apk
          "$bt/apksigner" verify --print-certs Daybook-Standalone.apk | tee signing.txt
          "$bt/aapt2" dump badging Daybook-Standalone.apk | tee package.txt
          grep -F "package: name='com.marcel.daybookstandalone' versionCode='1'" package.txt
          grep -F "application-label:'Daybook Standalone'" package.txt
          if grep -F "uses-permission: name='android.permission.INTERNET'" package.txt; then exit 1; fi
          sha256sum Daybook-Standalone.apk > SHA256SUMS
      - name: Enable emulator hardware acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Android emulator functionality tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash daybook/test/standalone.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Daybook-Standalone
          path: |
            daybook/build/Daybook-Standalone.apk
            daybook/build/SHA256SUMS
            daybook/build/package.txt
            daybook/build/signing.txt
            daybook/build/standalone-tests/result.txt
      - name: Publish manual download only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="daybook-standalone-${GITHUB_RUN_ID}"
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false --title "Daybook Standalone 2.0" --notes "Standalone Android app. Separate package and signing certificate. No online updater or change to any production update feed. APK build, signing and Android emulator tests passed. Data is separate; import a copy of an existing Daybook JSON backup if desired." daybook/build/Daybook-Standalone.apk daybook/build/SHA256SUMS daybook/build/package.txt daybook/build/signing.txt
          gh release download "$tag" -p Daybook-Standalone.apk -D "$RUNNER_TEMP/live"
          cmp daybook/build/Daybook-Standalone.apk "$RUNNER_TEMP/live/Daybook-Standalone.apk"
